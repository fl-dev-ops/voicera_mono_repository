version: '3.8'

services:
  mongodb:
    # NOTE: Community MongoDB doesn't include Atlas Search / vector search.
    # We'll keep this for now as the source-of-truth DB.
    image: mongo:latest
    container_name: voicera_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: voicera
    volumes:
      - mongodb_data:/data/db
    networks:
      voicera_network:
        aliases:
          - mongodb
    command: mongod --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./voicera_backend
      dockerfile: Dockerfile
    container_name: voicera_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./voicera_backend/.env
    environment:
      - MONGODB_HOST=mongodb
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./voicera_backend:/app
    working_dir: /app
    networks:
      - voicera_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  qdrant:
    image: qdrant/qdrant:latest
    container_name: voicera_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - voicera_network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: voicera_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - voicera_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  frontend:
    build:
      context: ./voicera_frontend
      dockerfile: Dockerfile
      secrets:
        - frontend_env
    container_name: voicera_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./voicera_frontend/.env.local
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - VOICE_SERVER_URL=http://voice_server:7860
    networks:
      - voicera_network
    depends_on:
      - backend

  voice_server:
    build:
      context: ./voice_2_voice_server
      dockerfile: Dockerfile
    container_name: voicera_voice_server
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - ./voice_2_voice_server:/app
    working_dir: /app
    environment:
      # LiveKit
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_SIP_OUTBOUND_TRUNK_ID=${LIVEKIT_SIP_OUTBOUND_TRUNK_ID}
      - LIVEKIT_SIP_URI=${LIVEKIT_SIP_URI:-}
      - DEFAULT_AGENT_ID=${DEFAULT_AGENT_ID:-}
      # Backend
      - VOICERA_BACKEND_URL=http://backend:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Storage
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      # Vobiz API (used to auto-patch inbound_destination on new trunks)
      - VOBIZ_AUTH_ID=${VOBIZ_AUTH_ID}
      - VOBIZ_AUTH_TOKEN=${VOBIZ_AUTH_TOKEN}
      - VOBIZ_API_BASE=${VOBIZ_API_BASE:-https://api.vobiz.ai/api/v1}
      # STT / TTS / LLM API keys
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # Memory
      - ENABLE_MEMORY_EACH_TURN=${ENABLE_MEMORY_EACH_TURN:-true}
      - MEMORY_TOP_K=${MEMORY_TOP_K:-5}
      - ENABLE_SMART_TURN=${ENABLE_SMART_TURN:-true}
    networks:
      - voicera_network
    depends_on:
      - backend
      - minio
    command: python main.py start

  whatsapp_sender:
    build:
      context: ./apps/whatsapp-link-sender
      dockerfile: Dockerfile
    container_name: voicera_whatsapp_sender
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - AUTH_STATE_DIR=/app/auth_state
      - LOG_LEVEL=info
    volumes:
      - ./apps/whatsapp-link-sender/auth_state:/app/auth_state
    networks:
      - voicera_network

  nginx:
    image: nginx:alpine
    container_name: voicera_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - voicera_network

volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  voicera_network:
    driver: bridge

secrets:
  frontend_env:
    file: ./voicera_frontend/.env.local
