services:
  voicera-db:
    image: mongo:latest
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-voicera}
    volumes:
      - voicera_mongodb_data:/data/db
    networks:
      - web
    command: mongod --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  voicera-storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - voicera_minio_data:/data
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  voicera-qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - voicera_qdrant_data:/qdrant/storage
    networks:
      - web
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://localhost:6333/healthz | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: devopsfl/voicera-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      - MONGODB_HOST=voicera-db
      - MONGODB_PORT=27017
      - MONGODB_USER=${MONGODB_USER:-admin}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-voicera}
      - MONGODB_AUTH_SOURCE=admin
      - SECRET_KEY=${SECRET_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - QDRANT_URL=http://voicera-qdrant:6333
      - MEMORY_EMBED_MODEL=${MEMORY_EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      - DEFAULT_COUNTRY_CODE=${DEFAULT_COUNTRY_CODE:-91}
      - MINIO_ENDPOINT=voicera-storage:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - VOBIZ_API_BASE_URL=https://api.vobiz.ai/api/v1
      - VOBIZ_ACCOUNT_ID=${VOBIZ_AUTH_ID}
      - VOBIZ_AUTH_ID=${VOBIZ_AUTH_ID}
      - VOBIZ_AUTH_TOKEN=${VOBIZ_AUTH_TOKEN}
      - FRONTEND_URL=https://${DOMAIN}
      - DEBUG=False
    networks:
      - web
    depends_on:
      - voicera-db
      - voicera-storage
      - voicera-qdrant
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.voicera-backend.rule=Host(`api.${DOMAIN}`)"
        - "traefik.http.routers.voicera-backend.entrypoints=websecure"
        - "traefik.http.routers.voicera-backend.tls=true"
        - "traefik.http.routers.voicera-backend.tls.certresolver=suryaumapathyresolver"
        - "traefik.http.routers.voicera-backend.service=voicera-backend"
        - "traefik.http.services.voicera-backend.loadbalancer.server.port=8000"

  frontend:
    image: devopsfl/voicera-frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VOICE_SERVER_URL=http://voice_server:7860
    networks:
      - web
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.voicera-frontend.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.voicera-frontend.entrypoints=websecure"
        - "traefik.http.routers.voicera-frontend.tls=true"
        - "traefik.http.routers.voicera-frontend.tls.certresolver=suryaumapathyresolver"
        - "traefik.http.routers.voicera-frontend.service=voicera-frontend"
        - "traefik.http.services.voicera-frontend.loadbalancer.server.port=3000"

  voice_server:
    image: devopsfl/voicera-voice:${TAG:-latest}
    restart: unless-stopped
    environment:
      # LiveKit
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_SIP_OUTBOUND_TRUNK_ID=${LIVEKIT_SIP_OUTBOUND_TRUNK_ID}
      - DEFAULT_AGENT_ID=${DEFAULT_AGENT_ID:-}
      # Backend
      - VOICERA_BACKEND_URL=http://backend:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Storage
      - MINIO_ENDPOINT=voicera-storage:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=false
      # STT / TTS / LLM API keys
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # Memory
      - ENABLE_MEMORY_EACH_TURN=${ENABLE_MEMORY_EACH_TURN:-true}
      - MEMORY_TOP_K=${MEMORY_TOP_K:-6}
      - ENABLE_SMART_TURN=${ENABLE_SMART_TURN:-true}
    networks:
      - web
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.voicera-voice.rule=Host(`voice.${DOMAIN}`)"
        - "traefik.http.routers.voicera-voice.entrypoints=websecure"
        - "traefik.http.routers.voicera-voice.tls=true"
        - "traefik.http.routers.voicera-voice.tls.certresolver=suryaumapathyresolver"
        - "traefik.http.routers.voicera-voice.service=voicera-voice"
        - "traefik.http.services.voicera-voice.loadbalancer.server.port=7860"

  whatsapp_sender:
    image: devopsfl/voicera-whatsapp:${TAG:-latest}
    restart: unless-stopped
    environment:
      - PORT=8085
      - AUTH_STATE_DIR=/app/auth_state
      - LOG_LEVEL=${WHATSAPP_LOG_LEVEL:-info}
    volumes:
      - voicera_whatsapp_auth_data:/app/auth_state
    networks:
      - web
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.voicera-whatsapp.rule=Host(`whatsapp.${DOMAIN}`)"
        - "traefik.http.routers.voicera-whatsapp.entrypoints=websecure"
        - "traefik.http.routers.voicera-whatsapp.tls=true"
        - "traefik.http.routers.voicera-whatsapp.tls.certresolver=suryaumapathyresolver"
        - "traefik.http.routers.voicera-whatsapp.service=voicera-whatsapp"
        - "traefik.http.services.voicera-whatsapp.loadbalancer.server.port=8085"

networks:
  web:
    external: true
volumes:
  voicera_mongodb_data:
    driver: local
  voicera_minio_data:
    driver: local
  voicera_qdrant_data:
    driver: local
  voicera_whatsapp_auth_data:
    driver: local